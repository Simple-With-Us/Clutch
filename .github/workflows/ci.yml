name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m py_compile bridges/dsh/dsh-acp.py bridges/mmh/mmh-acp.py
      - run: git diff --check

  ios:
    name: iOS Build (Simulator)
    # Bumped from macos-15 (Xcode 16.4 / Swift 6.1.0) to macos-26 (Xcode 26 /
    # Swift 6.3) so SPM can resolve Kingfisher 8.13.0+, which declares
    # swift-tools-version:6.2. CI run 36485314601 (2026-09-28T21:11Z) failed
    # with "package 'kingfisher' @ 8.13.0 is using Swift tools version 6.2.0
    # but the installed version is 6.1.0" on the older image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Harness iOS App
        run: bash scripts/build-ios.sh --simulator

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
