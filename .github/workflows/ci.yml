name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: bash scripts/ios-fleet/test-scheduled-ship-gate.sh
      # The version-numbering rules (AFC-517):  the marketing version is the
      # next patch on the app's train and the build number is independent of
      # it.  The offline test script answers the App Store Connect queries
      # from a stub node, so it never touches the network.
      - run: bash scripts/ios-fleet/test-ship-seq.sh
      # The App Store Connect credential rules (AFC-459):  the key comes from
      # the environment or from Infisical, and a named ASC_KEY_PATH is ignored.
      - run: node --test scripts/ios-fleet/*.test.mjs
      - run: bash scripts/ios-fleet/test-asc-credentials.sh
      # The Infisical loader (AFC-465) and its entry-module regression
      # (AFC-475).  Clutch carried the canonical loader test without a line
      # that ran it, so the copy was never exercised here.
      - run: node --test scripts/infisical-fetch.node-test.mjs scripts/infisical-fetch.symlink-regression.node-test.mjs
      - run: python3 -m py_compile bridges/dsh/dsh-acp.py bridges/minimax/minimax-acp.py bridges/grok/grok-acp.py
      - run: git diff --check

  ios:
    name: iOS Build (Simulator)
    # Bumped from macos-15 (Xcode 16.4 / Swift 6.1.0) to macos-26 (Xcode 26 /
    # Swift 6.3) so SPM can resolve Kingfisher 8.13.0+, which declares
    # swift-tools-version:6.2. CI run 36485314601 (2026-09-28T21:11Z) failed
    # with "package 'kingfisher' @ 8.13.0 is using Swift tools version 6.2.0
    # but the installed version is 6.1.0" on the older image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Clutch iOS App
        run: bash scripts/build-ios.sh --simulator
      # The thread surfaces (the Code tab, the transcript, the find bar) are
      # UI, so they are verified by running them: the UI test drives the app
      # against a local stub sidecar and keeps a screenshot per state, which
      # the artifact below publishes for review.  A build alone proves the
      # code compiles, not that the surface works.
      - name: Run the iOS UI tests
        run: |
          set -o pipefail
          cd ios
          xcodegen generate
          # Pick the simulator at run time instead of naming one.  The macos-26
          # image dropped "iPhone 16 Pro" in 20261021.0445, so a hardcoded
          # device name turns this step into a permanent red that resolves no
          # device and runs no test at all.  Prefer the newest iPhone Pro that
          # exists, fall back to any iPhone, and select by UUID so a shared
          # display name cannot be ambiguous.
          sim_id=$(
            xcrun simctl list devices available \
              | awk -F '[()]' '
                  /iPhone 17 Pro/ && /Booted/ { booted17 = $2 }
                  /iPhone 17 Pro/ && p17 == "" { p17 = $2 }
                  /iPhone 16 Pro/ && p16 == "" { p16 = $2 }
                  /iPhone / && first == "" { first = $2 }
                  END {
                    if (booted17 != "") print booted17
                    else if (p17 != "") print p17
                    else if (p16 != "") print p16
                    else print first
                  }
                '
          )
          if [ -z "$sim_id" ]; then
            echo "::error::No available iPhone simulator on this runner."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator ID: $sim_id"
          xcrun simctl boot "$sim_id" 2>/dev/null || true
          xcodebuild -project Clutch.xcodeproj \
            -scheme Clutch \
            -destination "platform=iOS Simulator,id=$sim_id" \
            -only-testing:ClutchUITests/ClutchThreadSurfaceUITests \
            -resultBundlePath "$RUNNER_TEMP/clutch-ios-ui.xcresult" \
            test
      - name: Publish the iOS UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-screenshots
          path: ${{ runner.temp }}/clutch-ios-ui.xcresult
          if-no-files-found: ignore

  macos:
    name: macOS Build
    # The native Mac app is its own Xcode target and its own scheme
    # ("Clutch macOS"), and no workflow built it.  The ios-ship TestFlight
    # workflow runs scripts/build-ios.sh, which is hardcoded to -scheme Clutch,
    # and mac-app-build.yml ships the separate dock shell built from
    # src/web/dock-app/ClutchWindow.swift.  So every swift change under
    # ios/Mac/ merged without ever being compiled.  This job closes that gap.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build Clutch macOS App
        run: |
          xcodebuild -project ios/Clutch.xcodeproj \
            -scheme "Clutch macOS" \
            -destination "generic/platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
