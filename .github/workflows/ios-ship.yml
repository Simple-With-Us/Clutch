name: iOS TestFlight ship (GitHub-hosted macOS)

# Archive + upload on GitHub-hosted xcode-27 runners.  Fork PRs never run here.
# Signing + ASC keys come from Infisical prod through .github/actions/infisical-secrets.
# Internal TestFlight testers only; no standing external-beta sync step.
#
# AUTO-SHIP CONTRACT (owner 2026-10-17): a merge to main that touches ios/**
# (the `push:` paths filter below) uploads a fresh TestFlight build with no
# human step and publishes What to Test (IOS_TF_RELEASE_NOTES=1).
# `workflow_dispatch` is the manual path.  tests/ios-ship-workflow.test.ts pins
# these pieces in CI.  The rate gate and the same-HEAD skip are the ship
# script's defaults: never set IOS_TF_MIN_INTERVAL_SEC or --force-ship in this
# file (a one-off override belongs on a dispatch input for that run only).
#
# WHY THERE IS A `schedule:` TRIGGER (C-84, 2026-10-17)
# -----------------------------------------------------
# `push:` alone never retries.  A ship that fails (here: altool 90717, an alpha
# channel in the 1024 AppIcon after #133, which failed three main pushes in a
# row) leaves main ahead of TestFlight until the NEXT ios/ merge.  A PR merged by
# github-actions[bot] under GitHub's recursion guard dispatches no push run at
# all.  `schedule:` events are exempt from both gaps, so the hourly tick notices
# an iOS change that no push shipped and ships it.
#
# NOT EVERY TICK SHIPS.  A cron carries no `paths:` filter, so the scheduled
# path is guarded twice:
#   1. scripts/ios-fleet/scheduled-ship-gate.sh refuses to try unless ios/
#      actually changed between the last successful ship's sha and HEAD.  It
#      reads that sha from ~/.cache/ios-fleet, which a hosted runner starts
#      without, so the cache restore/save steps below carry it between runs.  No
#      recorded ship means the tick skips; a first ship is a push or a dispatch.
#   2. ship-testflight.sh rate-limits successful uploads per app and skips when
#      HEAD already shipped.  Both skips exit 0 and consume no build number.
# Hourly, not twice an hour: while a ship is persistently broken every tick
# re-archives on a hosted macOS runner, so the cadence is the cost cap.

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'assets/clutch-icon-1024.png'
      - 'scripts/ios-fleet/**'
      - 'scripts/ios-ship-testflight.sh'
      - 'scripts/ios-appstore-gm-prepare.sh'
      - 'scripts/ios-install-appstore-profiles.sh'
      - 'scripts/ios-xcodegen-post.sh'
      - 'scripts/ios-ui-tests.sh'
      - 'ios/appstore-profiles.json'
      - '.github/workflows/ios-ship.yml'
  workflow_dispatch:
  schedule:
    # Hourly at :23, offset from Socratic.Trade ('*/30'), Congress.Trade
    # ('7,37') and Usage-Monitor ('13,43') so the fleet repos do not start
    # ships on the same minute.
    - cron: '23 * * * *'
  pull_request:
    paths:
      - 'ios/**'
      - 'assets/clutch-icon-1024.png'
      - 'scripts/ios-fleet/**'
      - 'scripts/ios-ship-testflight.sh'
      - 'scripts/build-ios.sh'
      - 'scripts/ios-ui-tests.sh'
      - '.github/workflows/ios-ship.yml'

permissions:
  contents: read

concurrency:
  # The group MUST separate pull_request runs from main runs.
  #
  # This workflow is triggered by push, schedule AND pull_request, and the
  # ship job is skipped on pull_request, so a PR run contributes nothing to
  # TestFlight.  While PR runs shared one group with the push-to-main ship,
  # they silently destroyed it: when a newer run enters a concurrency group,
  # GitHub cancels the run already pending in it, so a PR run evicted the
  # pending main ship and that merge never reached TestFlight.
  #
  # 2026-10-24, twice in 70 minutes:
  #   - PR #195 (merge 6b3487f2) ship run 40075066124 was cancelled at
  #     07:48:58Z by PR run 40075616002 on another branch (jobs: [], never
  #     dispatched).
  #   - push ed510c85 ship run 40070842392 was cancelled the same way.
  #
  # Keying the group on the event keeps every PR dry-run in its own group and
  # leaves push + schedule serialised against each other in the 'main' group,
  # so a cron tick and a push can never upload two builds for the same HEAD.
  # Same shape as Usage-Monitor's mac-release.yml.
  group: ios-ship-clutch-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: false

jobs:
  ship:
    name: TestFlight archive + upload
    if: github.event.repository.fork == false && github.event_name != 'pull_request'
    runs-on: xcode-27
    outputs:
      # The one build number this release carries, planned once by the
      # plan-build step below and handed to every platform ship of the release.
      build: ${{ steps.plan.outputs.build }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Restore and save are separate steps because actions/cache only saves in
      # its post step, which runs on every successful tick (a new run_id entry
      # per hourly skip) and is skipped when the job fails.  This saves only on
      # ticks that tried to ship, so the last-ship state advances exactly when a
      # ship ran and a no-op tick writes nothing.
      - name: Restore iOS ship state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-clutch-${{ github.run_id }}
          restore-keys: |
            ios-fleet-clutch-

      - name: Scheduled ship gate (skip unless iOS code changed)
        id: gate
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ios-fleet/scheduled-ship-gate.sh" \
            --event "${{ github.event_name }}" \
            --path-prefix 'ios/' \
            --repo-root "$GITHUB_WORKSPACE" \
            clutch

      - name: Assert stable Xcode (never beta)
        if: steps.gate.outputs.should_ship == '1'
        run: |
          bash scripts/ios-assert-xcode.sh 27.0
          xcodebuild -version
          case "$DEVELOPER_DIR" in
            *[Bb]eta*)
              echo "::error::DEVELOPER_DIR resolves to a beta Xcode: $DEVELOPER_DIR"
              exit 1
              ;;
          esac
          if xcodebuild -version | grep -qi beta; then
            echo "::error::xcodebuild reports a beta Xcode toolchain"
            exit 1
          fi

      - name: Install xcodegen
        if: steps.gate.outputs.should_ship == '1'
        run: bash scripts/ios-install-xcodegen.sh

      - name: Load shared ASC key and Clutch signing certificate
        if: steps.gate.outputs.should_ship == '1'
        env:
          INFISICAL_PROJECT_ID: 077fd6f3-9f9b-438e-9b6f-5c69076cf36c
          INFISICAL_ASC_PROJECT_ID: 8dae6d03-8f12-48b2-adf3-e5c1b881c8c5
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID || secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET || secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          npm install zod@4.4.3 --no-save --no-audit --no-fund
          node scripts/ios-signing-fetch.mjs

      - name: Import signing + ASC key
        if: steps.gate.outputs.should_ship == '1'
        run: |
          if [ -z "${APPLE_API_KEY_ID:-}" ]; then
            echo "::error::APPLE_API_KEY_ID empty after Infisical export.  Check Fleet-OPS prod /asc, Clutch prod /, and the CI machine identity read access to both.  Confirm codes.clutch.ios (Apple ID 6817951255) exists in App Store Connect before shipping."
            exit 1
          fi
          bash "$GITHUB_WORKSPACE/scripts/ios-appstore-gm-prepare.sh"

      - name: Plan release build (once per release)
        id: plan
        if: steps.gate.outputs.should_ship == '1'
        run: |
          build="$(bash scripts/ios-ship-testflight.sh --plan-build-only)"
          case "$build" in
            [1-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]) ;;
            *)
              echo "::error::plan-build-only printed no 12-digit build number"
              exit 1
              ;;
          esac
          echo "planned build for this release: ${build}"
          echo "build=${build}" >>"$GITHUB_OUTPUT"

      - name: Ship Clutch to TestFlight
        if: steps.gate.outputs.should_ship == '1'
        env:
          IOS_TF_RELEASE_NOTES: "1"
          IOS_MANUAL_SIGN: "1"
        run: bash scripts/ios-ship-testflight.sh --build "${{ steps.plan.outputs.build }}"

      - name: Sync standing TestFlight testers
        if: success() && steps.gate.outputs.should_ship == '1'
        continue-on-error: true
        env:
          ASC_STANDING_TESTERS: ${{ secrets.ASC_STANDING_TESTERS }}
        run: |
          for e in $(printf '%s' "${ASC_STANDING_TESTERS:-}" | tr ',;' '  '); do
            echo "::add-mask::${e}"
          done
          set +e
          appleid="$(python3 -c 'import json;print(json.load(open("scripts/ios-fleet/apps.json"))["apps"]["clutch"]["appleId"])')"
          appleid_rc=$?
          set -e
          if [ "$appleid_rc" -ne 0 ] || [ -z "$appleid" ]; then
            echo "::warning title=TestFlight standing testers::could not read the clutch appleId from scripts/ios-fleet/apps.json (rc=${appleid_rc}); tester sync skipped.  The TestFlight upload itself succeeded."
            exit 0
          fi
          set +e
          node scripts/ios-fleet/asc-api.mjs ensure-standing-testers "$appleid"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=TestFlight standing testers::tester sync exited ${rc}; see the standing-testers lines above.  The TestFlight upload itself succeeded."
          fi

      # Saved even when the ship step failed after it recorded the upload, but
      # only on ticks that tried to ship.
      - name: Save iOS ship state
        if: ${{ always() && steps.gate.outputs.should_ship == '1' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ios-fleet
          key: ios-fleet-clutch-${{ github.run_id }}

  pr-build-only:
    name: iOS archive dry-run (PR)
    if: github.event_name == 'pull_request' && github.event.repository.fork == false
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Assert stable Xcode (never beta)
        run: bash scripts/ios-assert-xcode.sh 27.0
      - name: Install xcodegen
        run: bash scripts/ios-install-xcodegen.sh
      - name: Simulator Release compile (unsigned)
        run: bash scripts/build-ios.sh --simulator --release
