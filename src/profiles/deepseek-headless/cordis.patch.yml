# Patch layer for the deepseek-headless profile (dsh --profile deepseek-headless).
#
# The phone cannot answer interactive prompts, review plans, or steer
# long-running delegation, and the headless runner emits nothing until the
# final answer — so the tools below are the ones that made "real questions"
# sit on "thinking…" for tens of minutes.  Disabled here; re-enable any row
# if you want that capability from the phone.
#
# Tool approvals are NOT the issue: settings-deepseek-headless.yaml (and the
# bridge's DSH_PERMISSION_MODE=danger-full-access) keep
# sandbox=danger-full-access / approval=never.  These rows block or fan out
# regardless of approval.
#
# __DSH_HOME__ is replaced with Clutch's engine home ($CLUTCH_HOME/dsh) by
# scripts/sync-profiles.ts when the profile is synced.
- id: settings
  config:
    path: __DSH_HOME__/settings-deepseek-headless.yaml
- id: user-questions
  disabled: true
- id: plan-mode
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web
  disabled: true
- id: web-fetch-http
  disabled: true
- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: low
