# Settings for the minimax-headless profile only (dsh --profile minimax-headless).
# Shellular MiniMax → minimax-acp.py → dsh --profile minimax-headless with the
# MiniMax LLM.
#
# Keep permission.defaultPreset: danger-full-access — the phone cannot answer
# approval: ask prompts (same posture as settings-deepseek-headless.yaml).
permission:
  defaultPreset: danger-full-access

agent-default-model:
  provider: minimax
  model: MiniMax-M3
  reasoningEffort: low

# MiniMax models ride the llm-pi-ai provider namespace inside @deepseek-ai/dsh.
# apiKeyEnv must match MINIMAX_API_KEY (loaded by minimax-acp / credentials.yaml).
#
# Model list is the owner-facing set: M3.1 Flash, M3 and M2.7 Highspeed.  M2.7
# (non-highspeed) stays out — M3 dominates on context.  M2.7-highspeed keeps a
# place because it is the same 204,800 context at exactly 2x M3's price; the
# picker badges it so the cost is visible up front.
#
# MiniMax-M3.1-Flash is the stable successor to MiniMax-M3.1-Flash-Preview,
# which MiniMax retired on 2026-10-18 (BF-2494 / minimax/drop-m31-flash-preview).
# The replacement is verified live on both routes: the MiniMax API lists it on
# /v1/models and /anthropic/v1/models, and a real turn on it answers.  The
# Preview id must not come back — the runtime errors `Invalid params: unknown
# model option` for retired MiniMax-internal previews.
llm-pi-ai:
  providers:
    {
      minimax:
        {
          apiKeyEnv: MINIMAX_API_KEY,
          models:
            [
              {
                  id: MiniMax-M3.1-Flash,
                  name: MiniMax-M3.1-Flash,
                  contextWindow: 1000000,
                  maxTokens: 128000,
                  reasoningEfforts:
                    {
                      low: low,
                      medium: medium,
                      high: high,
                      xhigh: xhigh,
                      max: max
                    },
                  compat: { forceAdaptiveThinking: true }
                },
              {
                  id: MiniMax-M3,
                  name: MiniMax-M3,
                  contextWindow: 1000000,
                  maxTokens: 128000,
                  reasoningEfforts:
                    {
                      low: low,
                      medium: medium,
                      high: high
                    }
                },
              {
                  id: MiniMax-M2.7-highspeed,
                  name: MiniMax-M2.7-highspeed,
                  contextWindow: 204800,
                  maxTokens: 131072,
                  reasoningEfforts: false
                }
            ]
        }
    }
