# Patch layer for the MiniMax coding profile (dsh --profile minimax-headless).
# Shellular's MiniMax agent (minimax-acp.py) drives this profile — the full
# engine tool loop with MiniMax as the LLM (not the old HTTP chat/completions
# shim).
#
# Same phone-safe disables as deepseek-headless: no interactive prompts, no
# web fan-out that hung Thinking.  Tool approvals stay danger-full-access via
# settings-minimax-headless.yaml + DSH_PERMISSION_MODE.
#
# __DSH_HOME__ is replaced with Clutch's engine home ($CLUTCH_HOME/dsh) by
# scripts/sync-profiles.ts when the profile is synced.
- id: settings
  config:
    path: __DSH_HOME__/settings-minimax-headless.yaml
- id: user-questions
  disabled: true
- id: plan-mode
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: tool-goal
  disabled: true
- id: tool-web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web
  disabled: true
- id: web-fetch-http
  disabled: true
