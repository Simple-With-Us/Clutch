name: Clutch
options:
  bundleIdPrefix: codes.clutch
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
  createIntermediateGroups: true
  projectFormat: xcode16_3
  xcodeVersion: '27.0'
  postGenCommand: bash ../scripts/ios-xcodegen-post.sh
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CC8UTF7ATG
    ASSETCATALOG_FILTER_FOR_THINNING: false
    ENABLE_ASSET_THINNING: false
    # Native Sentry. Empty unless xcodebuild/CI passes SENTRY_DSN=...
    # SentryTelemetry.swift skips init when this expands to empty or $(SENTRY_DSN).
    SENTRY_DSN: ""
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: "9.31.0"
  CometChatUIKitSwift:
    url: https://github.com/cometchat/cometchat-uikit-ios.git
    from: 5.2.3
targets:
  Clutch:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
      - path: Assets.xcassets
    dependencies:
      - package: CometChatUIKitSwift
        product: CometChatUIKitSwift
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_NAME: Clutch
        PRODUCT_BUNDLE_IDENTIFIER: codes.clutch.ios
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        # PLACEHOLDERS, not the source of truth for what ships next: the ship
        # script passes both values on the xcodebuild command line
        # (MARKETING_VERSION = the fixed 0.1.0 train, CURRENT_PROJECT_VERSION =
        # the per-release merge-stamp build).  Do not sequence from these.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "202610290000"  # placeholder; ship script overrides per build
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: false
        ENABLE_ON_DEMAND_RESOURCES: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: false
        CODE_SIGN_ENTITLEMENTS: Clutch.entitlements
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "Clutch iOS App Store (API)"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Clutch
        CFBundleName: Clutch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SENTRY_DSN: $(SENTRY_DSN)
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: codes.clutch.pairing
            CFBundleURLSchemes:
              - clutch
              - minimax
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Clutch connects to the Clutch server or MiniMax Code on your local network.
        NSCameraUsageDescription: Clutch uses the camera to scan host pairing QR codes.
        NSMicrophoneUsageDescription: Clutch records audio while you hold to talk to dictate coding directives.
        NSSpeechRecognitionUsageDescription: Clutch transcribes speech into coding directives and prompts.
        NSBonjourServices:
          - _clutch._tcp
          - _minimax._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  ClutchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Clutch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: codes.clutch.ios.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Clutch.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Clutch
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_VERSION: '5.9'
  ClutchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Clutch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: codes.clutch.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Clutch
        SWIFT_VERSION: '5.9'
  Clutch macOS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          # App/Info.plist is the iOS target's plist.  Left in, XcodeGen puts it
          # in this target's Copy Bundle Resources phase and every Mac release
          # carries a foreign Contents/Resources/Info.plist with iOS-only keys.
          # This target's own plist is Mac/Info.plist (info.path below).
          - Info.plist
          - SentryTelemetry.swift
          - Services/CometChatManager.swift
          - Views/ChatView.swift
          - Views/AgentMessagesVC.swift
          - Views/PairingScannerSheet.swift
          - Views/ClutchWebView.swift
          - Views/Components
      - path: Mac
      - path: Resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Clutch
        PRODUCT_BUNDLE_IDENTIFIER: codes.clutch.macos
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        # PLACEHOLDERS, not the source of truth: the ship script passes both
        # values on the xcodebuild command line.  Do not sequence from these.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "202610290000"  # placeholder; ship script overrides per build
        SWIFT_VERSION: '5.9'
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: false
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Clutch
        CFBundleName: Clutch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        NSHighResolutionCapable: true
        CFBundleURLTypes:
          - CFBundleURLName: codes.clutch.pairing
            CFBundleURLSchemes:
              - clutch
              - minimax
        NSBonjourServices:
          - _clutch._tcp
          - _minimax._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Clutch connects to the Clutch server or MiniMax Code on your local network.
        NSMicrophoneUsageDescription: Clutch records audio while you hold to talk to dictate coding directives.
        NSSpeechRecognitionUsageDescription: Clutch transcribes speech into coding directives and prompts.
schemes:
  Clutch:
    build:
      targets:
        Clutch: all
        ClutchTests: [test]
        ClutchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClutchTests
        - ClutchUITests
    archive:
      config: Release
  Clutch macOS:
    build:
      targets:
        Clutch macOS: all
    run:
      config: Debug
    archive:
      config: Release
