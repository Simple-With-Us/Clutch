name: Clutch
options:
  bundleIdPrefix: codes.clutch
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CC8UTF7ATG
    ASSETCATALOG_FILTER_FOR_THINNING: false
    ENABLE_ASSET_THINNING: false
targets:
  Clutch:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Clutch
        PRODUCT_BUNDLE_IDENTIFIER: codes.clutch.ios
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "202609301500"
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: false
        ENABLE_ON_DEMAND_RESOURCES: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: false
        CODE_SIGN_ENTITLEMENTS: Clutch.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Clutch
        CFBundleName: Clutch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: codes.clutch.pairing
            CFBundleURLSchemes:
              - clutch
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Clutch connects to the clutch server running on a Mac on your local network.
        NSCameraUsageDescription: Clutch uses the camera to scan the pairing code shown on your Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  ClutchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Clutch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: codes.clutch.ios.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Clutch.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Clutch
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_VERSION: '5.9'
  ClutchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Clutch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: codes.clutch.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Clutch
        SWIFT_VERSION: '5.9'
schemes:
  Clutch:
    build:
      targets:
        Clutch: all
        ClutchTests: [test]
        ClutchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClutchTests
        - ClutchUITests
    archive:
      config: Release
