name: Harness
options:
  bundleIdPrefix: com.simplewithus
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: '5.9'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: CC8UTF7ATG
    ASSETCATALOG_FILTER_FOR_THINNING: false
    ENABLE_ASSET_THINNING: false
targets:
  Harness:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: Harness
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.harness.ios
        DEVELOPMENT_TEAM: CC8UTF7ATG
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "202609301500"
        SWIFT_VERSION: '5.9'
        TARGETED_DEVICE_FAMILY: '1,2'
        SUPPORTS_MACCATALYST: false
        ENABLE_ON_DEMAND_RESOURCES: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: false
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: false
        CODE_SIGN_ENTITLEMENTS: Harness.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Harness
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.simplewithus.harness.pairing
            CFBundleURLSchemes:
              - harness
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Harness connects to harness running on a Mac on your local network.
        NSCameraUsageDescription: Harness uses the camera to scan the pairing code shown on your Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  HarnessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Harness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.harness.ios.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Harness.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Harness
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_VERSION: '5.9'
  HarnessUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Harness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplewithus.harness.ios.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: Harness
        SWIFT_VERSION: '5.9'
schemes:
  Harness:
    build:
      targets:
        Harness: all
        HarnessTests: [test]
        HarnessUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HarnessTests
        - HarnessUITests
    archive:
      config: Release
